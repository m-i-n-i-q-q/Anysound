<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>音訊分析器</title>

<style>
body{font-family:sans-serif;margin:40px;background:#f0f0f0;}
.panel{background:white;padding:20px;margin-bottom:20px;border-radius:10px;}
textarea{width:100%;height:200px;}
select,input{margin-top:5px;}
</style>
</head>

<body>

<h1 id="title">音訊分析器</h1>

<div class="panel">

<label id="fileLabel">選擇音訊檔</label><br>
<input type="file" id="fileInput">

<br><br>

<label id="maxLabel">最大單音數</label><br>
<input type="number" id="maxPartials" value="30">

<br><br>

<label id="langLabel">語言</label><br>
<select id="langSelect" onchange="setLanguage()">
  <option value="zh">中文</option>
  <option value="en">English</option>
</select>

<br><br>

<button onclick="analyze()" id="startBtn">開始分析</button>

</div>

<div class="panel">
<div id="info">尚未開始</div>
</div>

<div class="panel">
<textarea id="output"></textarea>
</div>

<script>

// 🌐 語言資料
const LANG = {
  zh:{
    lang:"語言",
    title:"音訊分析器",
    file:"選擇音訊檔",
    max:"最大單音數",
    start:"開始分析",
    idle:"尚未開始",
    loading:"讀取中...",
    processing:"分析中：",
    done:"完成！",
    chooseFile:"請選擇音訊"
  },
  en:{
    lang:"Language",
    title:"Audio Analyzer",
    file:"Select Audio File",
    max:"Max Partials",
    start:"Start",
    idle:"Idle",
    loading:"Loading...",
    processing:"Processing: ",
    done:"Done!",
    chooseFile:"Please select a file"
  }
}

let currentLang = "zh"

function setLanguage(){

  currentLang = document.getElementById("langSelect").value
  let L = LANG[currentLang]
  langLabel.innerText = L.lang
  title.innerText = L.title
  fileLabel.innerText = L.file
  maxLabel.innerText = L.max
  startBtn.innerText = L.start
  info.innerText = L.idle
}

async function analyze(){

let L = LANG[currentLang]

let file=document.getElementById("fileInput").files[0]
if(!file){
  alert(L.chooseFile)
  return
}

info.innerText = L.loading

let buffer=await file.arrayBuffer()

let audioCtx=new AudioContext()
let audio=await audioCtx.decodeAudioData(buffer)

let data=audio.getChannelData(0)
let sr=audio.sampleRate

let worker=new Worker("worker.js")

worker.postMessage({
  data:data,
  sampleRate:sr,
  maxPartials:Number(document.getElementById("maxPartials").value)
})

worker.onmessage=function(e){

  if(e.data.progress!==undefined){
    info.innerText = L.processing + (e.data.progress*100).toFixed(1) + "%"
  }

  if(e.data.segment){
    output.value += e.data.segment + "\n\n"
  }

  if(e.data.done){
    info.innerText = L.done
  }
}

}

// 初始化語言
setLanguage()

</script>

</body>
</html>
