<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>音訊分析器</title>

<style>
body{font-family:sans-serif;margin:40px;background:#f0f0f0;}
.panel{background:white;padding:20px;margin-bottom:20px;border-radius:10px;}
textarea{width:100%;height:200px;}
</style>
</head>

<body>

<h1>音訊分析器</h1>

<div class="panel">
<input type="file" id="fileInput">
<br><br>
<button onclick="analyze()">開始分析</button>
</div>

<div class="panel">
<div id="info">尚未開始</div>
</div>

<div class="panel">
<textarea id="output"></textarea>
</div>

<script>

async function analyze(){

let file=document.getElementById("fileInput").files[0]
if(!file){
  alert("請選擇音訊")
  return
}

let buffer=await file.arrayBuffer()

let audioCtx=new AudioContext()
let audio=await audioCtx.decodeAudioData(buffer)

let data=audio.getChannelData(0)
let sr=audio.sampleRate

let worker=new Worker("worker.js")

worker.postMessage({
  data:data,
  sampleRate:sr
})

worker.onmessage=function(e){

  if(e.data.progress!==undefined){
    info.innerText="進度："+(e.data.progress*100).toFixed(1)+"%"
  }

  if(e.data.segment){
    output.value += e.data.segment + "\n\n"
  }

  if(e.data.done){
    info.innerText="完成！"
  }
}

}

</script>

</body>
</html>
